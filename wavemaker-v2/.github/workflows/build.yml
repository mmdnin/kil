name: Buid
on:
  push:
    branches: [ "main", "master" ]
  release:
    types: [ published ]
  workflow_dispatch: # <--- 允许在网页点击按钮触发

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm install
          # 强制安装稳定版 Dexie 和移除不必要的 rxjs 依赖
          npm install dexie@3.2.4 --save
          # 如果代码中确实没用到 @vueuse/rxjs，这步会确保它不会被错误引用
          npm uninstall @vueuse/rxjs || true 

      - name: Build
        run: npm run build

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-build-${{ github.run_number }}
          path: dist/
          retention-days: 7  
